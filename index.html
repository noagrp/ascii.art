<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ASCII Art</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; gap: 15px; padding: 20px; background: #f0f0f0; }
        #canvas-container { border: 4px solid #333; background: #fff; cursor: crosshair; }
        canvas { display: block; image-rendering: pixelated; }
        #ascii-output { font-family: 'Courier New', Courier, monospace; width: 420px; height: 300px; white-space: pre; background: #111; color: #0f0; padding: 10px; font-size: 10px; line-height: 10px; border: 2px solid #333; }
        .controls { display: flex; gap: 5px; }
    </style>
</head>
<body>
    <h1>ASCII Art</h1>
    
    <div>
        <label>Resolution:</label>
        <select id="resSelect" onchange="updateResolution()">
            <option value="32">32 x 32</option>
            <option value="64">64 x 64</option>
            <option value="128">128 x 128</option>
        </select>
    </div>

    <input type="file" id="upload" accept="image/*">
    <div id="canvas-container">
        <canvas id="paint"></canvas>
    </div>
    
    <div class="controls">
        <button onclick="setMode('draw')">Draw</button>
        <button onclick="setMode('erase')">Erase</button>
        <button onclick="clearCanvas()">Clear</button>
        <button onclick="convertToAscii()" style="font-weight:bold;">Convert to ASCII</button>
        <button onclick="exportAscii()">Export .txt</button>
    </div>

    <textarea id="ascii-output" readonly placeholder="Your ASCII art will appear here..."></textarea>

    <script>
        const canvas = document.getElementById('paint');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const asciiArea = document.getElementById('ascii-output');
        const chars = " .:-=+*#%@";
        let res = 32;
        let mode = 'draw';

        function updateResolution() {
            res = parseInt(document.getElementById('resSelect').value);
            canvas.width = res;
            canvas.height = res;
            canvas.style.width = (res * 8) + "px";
            canvas.style.height = (res * 8) + "px";
            clearCanvas();
        }
        
        updateResolution();

        function setMode(m) { mode = m; }

        function clearCanvas() {
            ctx.clearRect(0, 0, res, res);
        }

        canvas.onmousemove = (e) => {
            if (e.buttons === 1) {
                const rect = canvas.getBoundingClientRect();
                const x = Math.floor((e.clientX - rect.left) / (rect.width / res));
                const y = Math.floor((e.clientY - rect.top) / (rect.height / res));
                if (mode === 'erase') ctx.clearRect(x, y, 1, 1);
                else { ctx.fillStyle = 'black'; ctx.fillRect(x, y, 1, 1); }
            }
        };

        document.getElementById('upload').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    ctx.clearRect(0, 0, res, res);
                    ctx.drawImage(img, 0, 0, res, res);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        };

        function convertToAscii() {
            const imgData = ctx.getImageData(0, 0, res, res).data;
            let output = "";
            for (let y = 0; y < res; y++) {
                for (let x = 0; x < res; x++) {
                    const i = (y * res + x) * 4;
                    const alpha = imgData[i + 3];
                    
                    if (alpha < 50) {
                        output += " "; 
                    } else {
                        const gray = (imgData[i] + imgData[i+1] + imgData[i+2]) / 3;
                        // Map brightness to chars, inverted (dark = @)
                        const charIdx = Math.floor((gray / 255) * (chars.length - 1));
                        output += chars[chars.length - 1 - charIdx];
                    }
                }
                output += "\n";
            }
            asciiArea.value = output;
        }

        function exportAscii() {
            const blob = new Blob([asciiArea.value], {type: 'text/plain'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'ascii_art.txt';
            a.click();
        }
    </script>
</body>
</html>
