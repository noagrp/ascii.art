<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>ASCII Art</title>
<link rel="manifest" href="./manifest.webmanifest?v=3">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png?v=3">
<link rel="apple-touch-icon" href="./apple-touch-icon.png?v=3">
<style>
:root{--bg:#0f172a;--panel:#111827;--panel2:#1f2937;--border:#334155;--text:#f8fafc;--muted:#94a3b8;--accent:#2563eb;--good:#059669;--danger:#991b1b;--art-size:min(420px,calc(100vw - 56px))}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.app{min-height:100vh;display:flex;flex-direction:column}.topbar{position:sticky;top:0;z-index:20;background:rgba(15,23,42,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand h1{font-size:17px;margin:0}.brand p{font-size:11px;color:var(--muted);margin:2px 0 0}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:0;border-radius:8px;background:#334155;color:#fff;padding:8px 10px;font-size:12px;font-weight:700;cursor:pointer}.btn.primary{background:var(--accent)}.btn.good{background:var(--good)}.btn.danger{background:var(--danger)}.layout{display:grid;grid-template-columns:minmax(280px,420px) minmax(0,1fr);gap:14px;padding:14px;max-width:1100px;width:100%;margin:auto;flex:1;align-items:start}.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px}.section{margin-bottom:12px}.section:last-child{margin-bottom:0}.section h2{font-size:13px;margin:0 0 9px;color:#bfdbfe}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.field{display:grid;gap:5px;min-width:0}.field label{font-size:10px;color:var(--muted)}.field input,.field select{width:100%;background:var(--panel2);border:1px solid var(--border);color:#fff;border-radius:8px;padding:8px;outline:none}.field input[type=range]{padding:0;accent-color:var(--accent)}.grow{flex:1}.art-frame{width:var(--art-size);height:var(--art-size);max-width:100%;aspect-ratio:1}.canvas-shell{background:#0b1220;border:1px solid var(--border);border-radius:10px;padding:10px;display:grid;place-items:center;overflow:hidden}.canvas-wrap{width:100%;height:100%;background:#fff;border:1px solid #475569;box-shadow:0 8px 24px rgba(0,0,0,.28);display:grid;place-items:center;overflow:hidden}.canvas-wrap canvas{display:block;image-rendering:pixelated;touch-action:none;width:100%;height:100%;object-fit:contain}.drop{border:1px dashed #475569;border-radius:9px;padding:10px;text-align:center;font-size:11px;color:var(--muted);cursor:pointer}.drop.drag{border-color:#60a5fa;color:#bfdbfe;background:#0b1830}.seg{display:flex;gap:6px}.seg button{flex:1}.seg button.active{background:var(--accent)}.ascii-pane{display:flex;flex-direction:column;align-items:center}.ascii-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;width:100%}.ascii-meta{font-size:10px;color:var(--muted)}.ascii-frame{width:var(--art-size);height:var(--art-size);max-width:100%;background:#05070a;border:1px solid var(--border);border-radius:10px;overflow:hidden;display:grid;place-items:center;padding:10px}.ascii-scale{display:inline-block;transform-origin:center center}.ascii-scale pre{margin:0;color:#7CFF6B;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;white-space:pre;font-size:8px;line-height:.9}.hint{font-size:10px;color:var(--muted);line-height:1.45}.status{font-size:10px;color:#cbd5e1}.mobile-tabs{display:none}@media(max-width:820px){:root{--art-size:min(440px,calc(100vw - 44px))}.layout{grid-template-columns:1fr;padding:10px}.mobile-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 10px 0}.mobile-tabs button{border:0;border-radius:8px;padding:9px;background:#334155;color:#fff;font-weight:700}.mobile-tabs button.active{background:var(--accent)}.layout.mobile-edit .ascii-col{display:none}.layout.mobile-preview .editor-col{display:none}.topbar{align-items:flex-start}.brand p{display:none}}@media(max-width:520px){:root{--art-size:calc(100vw - 40px)}.actions .secondary{display:none}.row.stack{display:grid;grid-template-columns:1fr}.ascii-frame{padding:8px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="brand"><h1>ASCII Art</h1><p>Draw or convert images locally</p></div><div class="actions"><button class="btn primary" id="newBtn">New</button><button class="btn" id="openBtn">Open Image</button><input id="upload" type="file" accept="image/*" hidden><button class="btn secondary" id="copyBtn">Copy ASCII</button><button class="btn secondary" id="txtBtn">TXT</button><button class="btn good" id="pngBtn">PNG</button></div></header>
<div class="mobile-tabs"><button id="editTab" class="active">Edit</button><button id="previewTab">ASCII</button></div>
<main class="layout mobile-edit" id="layout">
<section class="editor-col">
<div class="panel section"><h2>Source</h2><div class="drop" id="dropZone">Drop an image here or click to browse</div><div class="canvas-shell art-frame" style="margin:9px auto 0"><div class="canvas-wrap"><canvas id="paint"></canvas></div></div><div class="seg" style="margin-top:9px"><button class="btn active" data-mode="draw">Draw</button><button class="btn" data-mode="erase">Erase</button><button class="btn danger" id="clearBtn">Clear</button><button class="btn" id="undoBtn" disabled>Undo</button><button class="btn" id="redoBtn" disabled>Redo</button></div></div>
<div class="panel section"><h2>ASCII Controls</h2><div class="row stack"><div class="field grow"><label>Width</label><input id="widthRange" type="range" min="16" max="180" value="64"><div class="status"><span id="widthLabel">64</span> columns</div></div><div class="field grow"><label>Character Preset</label><select id="preset"><option value="standard">Standard</option><option value="dense">Dense</option><option value="blocks">Blocks</option><option value="simple">Simple</option><option value="binary">Binary</option><option value="custom">Custom</option></select></div></div><div class="field" id="customCharsWrap" style="margin-top:8px;display:none"><label>Custom Characters · darkest → lightest</label><input id="customChars" value="@%#*+=-:. "></div><div class="row" style="margin-top:8px"><div class="field grow"><label>Brightness</label><input id="brightness" type="range" min="-100" max="100" value="0"></div><div class="field grow"><label>Contrast</label><input id="contrast" type="range" min="-100" max="100" value="15"></div><div class="field grow"><label>Threshold</label><input id="threshold" type="range" min="0" max="255" value="0"></div></div><div class="row" style="margin-top:8px"><label class="status"><input id="invert" type="checkbox"> Invert</label><label class="status"><input id="preserveAspect" type="checkbox" checked> Preserve image aspect</label><label class="status"><input id="live" type="checkbox" checked> Live preview</label></div><div class="hint" style="margin-top:8px">Source and ASCII preview stay the same visible size. Resolution changes detail, not the physical layout.</div></div>
</section>
<section class="ascii-col"><div class="panel ascii-pane"><div class="ascii-head"><div><h2 style="margin:0;color:#bfdbfe;font-size:13px">ASCII Preview</h2><div class="ascii-meta" id="meta">64 columns</div></div><button class="btn primary" id="convertBtn">Convert</button></div><div class="ascii-frame" id="asciiFrame"><div class="ascii-scale" id="asciiScale"><pre id="asciiPreview"></pre></div></div></div></section>
</main>
</div>
<script>
const $=id=>document.getElementById(id),canvas=$('paint'),ctx=canvas.getContext('2d',{willReadFrequently:true});
const KEY='ascii_art_recovery_v2';let mode='draw',drawing=false,undo=[],redo=[],sourceAspect=1,saveTimer=null,asciiText='';
const ramps={standard:'@%#*+=-:. ',dense:'@#W$9876543210?!abc;:+=-,._ ',blocks:'█▓▒░ ',simple:'@#*:. ',binary:'@ '};
function sizeForSource(w,h){const max=128,scale=Math.min(1,max/w,max/h);return[Math.max(16,Math.round(w*scale)),Math.max(16,Math.round(h*scale))]}
function initCanvas(w=64,h=64){canvas.width=w;canvas.height=h;ctx.clearRect(0,0,w,h);push(true);scheduleSave()}
function snap(){return canvas.toDataURL('image/png')}
function updateHistory(){$('undoBtn').disabled=undo.length<=1;$('redoBtn').disabled=!redo.length}
function push(initial=false){if(initial)undo=[snap()];else{redo=[];undo.push(snap());if(undo.length>20)undo.shift()}updateHistory()}
function restore(url){const img=new Image();img.onload=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0);convertMaybe();scheduleSave()};img.src=url}
$('undoBtn').onclick=()=>{if(undo.length<=1)return;redo.push(undo.pop());restore(undo.at(-1));updateHistory()};$('redoBtn').onclick=()=>{if(!redo.length)return;const s=redo.pop();undo.push(s);restore(s);updateHistory()};
function pointerPos(e){const r=canvas.getBoundingClientRect();return{x:Math.floor((e.clientX-r.left)*canvas.width/r.width),y:Math.floor((e.clientY-r.top)*canvas.height/r.height)}}
canvas.addEventListener('pointerdown',e=>{drawing=true;canvas.setPointerCapture?.(e.pointerId);paintAt(e)});canvas.addEventListener('pointermove',e=>{if(drawing)paintAt(e)});canvas.addEventListener('pointerup',()=>{if(drawing){drawing=false;push();convertMaybe();scheduleSave()}});canvas.addEventListener('pointercancel',()=>drawing=false);
function paintAt(e){const p=pointerPos(e);if(p.x<0||p.y<0||p.x>=canvas.width||p.y>=canvas.height)return;if(mode==='erase')ctx.clearRect(p.x,p.y,1,1);else{ctx.fillStyle='#000';ctx.fillRect(p.x,p.y,1,1)}}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode});$('clearBtn').onclick=()=>{if(confirm('Clear the drawing?')){ctx.clearRect(0,0,canvas.width,canvas.height);push();convertMaybe();scheduleSave()}};
$('newBtn').onclick=()=>{if(!confirm('Start a blank canvas?'))return;sourceAspect=1;initCanvas(64,64);asciiText='';renderAscii()};
$('openBtn').onclick=()=>$('upload').click();$('dropZone').onclick=()=>$('upload').click();$('upload').onchange=e=>{const f=e.target.files?.[0];if(f)loadFile(f);e.target.value=''};['dragenter','dragover'].forEach(ev=>$('dropZone').addEventListener(ev,e=>{e.preventDefault();$('dropZone').classList.add('drag')}));['dragleave','drop'].forEach(ev=>$('dropZone').addEventListener(ev,e=>{e.preventDefault();$('dropZone').classList.remove('drag')}));$('dropZone').addEventListener('drop',e=>{const f=e.dataTransfer.files?.[0];if(f&&f.type.startsWith('image/'))loadFile(f)});
function loadFile(file){const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{sourceAspect=img.naturalWidth/img.naturalHeight;const [w,h]=sizeForSource(img.naturalWidth,img.naturalHeight);canvas.width=w;canvas.height=h;ctx.clearRect(0,0,w,h);const scale=Math.min(w/img.naturalWidth,h/img.naturalHeight),dw=img.naturalWidth*scale,dh=img.naturalHeight*scale;ctx.drawImage(img,(w-dw)/2,(h-dh)/2,dw,dh);push(true);convert();scheduleSave();URL.revokeObjectURL(url)};img.onerror=()=>{URL.revokeObjectURL(url);alert('Could not open this image.')};img.src=url}
function currentRamp(){return $('preset').value==='custom'?($('customChars').value||'@ '):ramps[$('preset').value]}
function renderAscii(){const pre=$('asciiPreview'),scaleBox=$('asciiScale'),frame=$('asciiFrame');pre.textContent=asciiText;scaleBox.style.transform='scale(1)';requestAnimationFrame(()=>{const w=Math.max(1,pre.scrollWidth),h=Math.max(1,pre.scrollHeight),aw=Math.max(1,frame.clientWidth-20),ah=Math.max(1,frame.clientHeight-20),s=Math.min(aw/w,ah/h,1);scaleBox.style.transform=`scale(${s})`})}
function convert(){const cols=+$('widthRange').value,ramp=currentRamp(),brightness=+$('brightness').value,contrast=+$('contrast').value,threshold=+$('threshold').value,invert=$('invert').checked;const aspect=$('preserveAspect').checked?(sourceAspect||canvas.width/canvas.height):(canvas.width/canvas.height);const rows=Math.max(4,Math.round(cols/aspect*.5));const tmp=document.createElement('canvas');tmp.width=cols;tmp.height=rows;const t=tmp.getContext('2d',{willReadFrequently:true});t.drawImage(canvas,0,0,cols,rows);const d=t.getImageData(0,0,cols,rows).data;let out='';for(let y=0;y<rows;y++){for(let x=0;x<cols;x++){const i=(y*cols+x)*4,a=d[i+3];if(a<20){out+=' ';continue}let lum=.2126*d[i]+.7152*d[i+1]+.0722*d[i+2];lum=Math.max(0,Math.min(255,lum+brightness*2.55));lum=Math.max(0,Math.min(255,128+(lum-128)*((contrast+100)/100)));if(threshold>0)lum=lum>=threshold?255:0;let n=lum/255;if(invert)n=1-n;out+=ramp[Math.max(0,Math.min(ramp.length-1,Math.round(n*(ramp.length-1))))]}out+='\n'}asciiText=out;renderAscii();$('meta').textContent=`${cols} × ${rows} characters`;scheduleSave()}
function convertMaybe(){if($('live').checked)convert()}
['widthRange','brightness','contrast','threshold'].forEach(id=>$(id).oninput=()=>{$('widthLabel').textContent=$('widthRange').value;convertMaybe()});['invert','preserveAspect','live'].forEach(id=>$(id).onchange=convertMaybe);$('preset').onchange=()=>{$('customCharsWrap').style.display=$('preset').value==='custom'?'grid':'none';convertMaybe()};$('customChars').oninput=convertMaybe;$('convertBtn').onclick=convert;window.addEventListener('resize',renderAscii);
$('copyBtn').onclick=async()=>{if(!asciiText)convert();try{await navigator.clipboard.writeText(asciiText);$('copyBtn').textContent='Copied';setTimeout(()=>$('copyBtn').textContent='Copy ASCII',1200)}catch{const ta=document.createElement('textarea');ta.value=asciiText;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}};
$('txtBtn').onclick=()=>{if(!asciiText)convert();const url=URL.createObjectURL(new Blob([asciiText],{type:'text/plain;charset=utf-8'}));download(url,`ascii_art_${Date.now()}.txt`);setTimeout(()=>URL.revokeObjectURL(url),1200)};
$('pngBtn').onclick=()=>{if(!asciiText)convert();const lines=asciiText.replace(/\n$/,'').split('\n'),font=12,line=12,pad=16,w=Math.max(...lines.map(l=>l.length))*7+pad*2,h=lines.length*line+pad*2,out=document.createElement('canvas');out.width=Math.max(1,w);out.height=Math.max(1,h);const o=out.getContext('2d');o.fillStyle='#05070a';o.fillRect(0,0,out.width,out.height);o.fillStyle='#7CFF6B';o.font=`${font}px monospace`;o.textBaseline='top';lines.forEach((l,i)=>o.fillText(l,pad,pad+i*line));out.toBlob(blob=>{if(!blob)return;const url=URL.createObjectURL(blob);download(url,`ascii_art_${Date.now()}.png`);setTimeout(()=>URL.revokeObjectURL(url),1200)},'image/png')};
function download(url,name){const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify({v:2,w:canvas.width,h:canvas.height,image:snap(),ascii:asciiText,settings:{width:$('widthRange').value,preset:$('preset').value,custom:$('customChars').value,brightness:$('brightness').value,contrast:$('contrast').value,threshold:$('threshold').value,invert:$('invert').checked,preserve:$('preserveAspect').checked},aspect:sourceAspect}))}catch{}},500)}
function loadRecovery(){try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(!r?.image)return false;canvas.width=r.w||64;canvas.height=r.h||64;const img=new Image();img.onload=()=>{ctx.drawImage(img,0,0);push(true);asciiText=r.ascii||'';renderAscii()};img.src=r.image;const s=r.settings||{};$('widthRange').value=s.width||64;$('widthLabel').textContent=$('widthRange').value;$('preset').value=s.preset||'standard';$('customChars').value=s.custom||'@%#*+=-:. ';$('brightness').value=s.brightness||0;$('contrast').value=s.contrast??15;$('threshold').value=s.threshold||0;$('invert').checked=!!s.invert;$('preserveAspect').checked=s.preserve!==false;sourceAspect=r.aspect||canvas.width/canvas.height;$('customCharsWrap').style.display=$('preset').value==='custom'?'grid':'none';return true}catch{return false}}
$('editTab').onclick=()=>{$('layout').className='layout mobile-edit';$('editTab').classList.add('active');$('previewTab').classList.remove('active')};$('previewTab').onclick=()=>{$('layout').className='layout mobile-preview';$('previewTab').classList.add('active');$('editTab').classList.remove('active');convertMaybe();setTimeout(renderAscii,0)};
if(!loadRecovery())initCanvas(64,64);if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js?v=3').catch(()=>{});
</script>
</body>
</html>
